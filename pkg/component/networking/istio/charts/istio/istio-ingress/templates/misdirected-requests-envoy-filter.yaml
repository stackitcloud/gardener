# Envoy proxy and istio do not support HTTP/2 client connection coalescing natively.
# Clients, especially web browsers, may open a single HTTP/2 connection and send requests
# targeted at different hosts all backed by the same IP address and wildcard certificate.
# Returning 421 for coalesced requests tells the client to open a new connection.
#
# We must maintain compatibility with kube-apiserver clients and proxies (like Rancher) 
# that inject unexpected Host headers (e.g., 'localhost'). We know this is fundamentally 
# a client-side problem, but we cannot easily fix all upstream tools and we need the compatibility.
# 
# We only return 421 if the SNI and Authority mismatch AND the requested Authority
# is actually covered by the certificate's SANs. This specific intersection proves
# the client is trying to reuse an existing TLS connection for a different valid
# domain (HTTP/2 coalescing).
#
# By narrowing the 421 response to this exact scenario, standard traffic (where SNI
# matches Authority) flows normally. Crucially, it also allows mismatched requests
# where the Authority is completely outside the certificate's scope (like 'localhost'),
# letting standard Envoy routing handle those custom proxies.
#
# Issues:
# - https://github.com/envoyproxy/envoy/issues/6767
# - https://github.com/istio/istio/issues/13589
# - https://github.com/rancher/rancher/issues/55596
# Documentation:
# - https://istio.io/latest/docs/ops/common-problems/network-issues/#404-errors-occur-when-multiple-gateways-configured-with-same-tls-certificate
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: misdirected-requests
  namespace: {{ .Release.Namespace }}
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        portNumber: 9443
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.lua
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          inlineCode: |
            function envoy_on_request(request_handle)
              local streamInfo = request_handle:streamInfo()
              local sni = streamInfo:requestedServerName()
              local authority = request_handle:headers():get(":authority")

              -- Abort early if essential routing data is missing
              if sni == "" or authority == nil then
                return
              end

              -- Strip the :443 port suffix from the authority header if it exists
              local authority_no_port = authority
              if string.sub(authority, -4) == ":443" then
                authority_no_port = string.sub(authority, 1, -5)
              end

              -- STEP 1: FAST PATH (Normal Traffic)
              -- If the client requested the exact same host in TLS (SNI) and HTTP (:authority),
              -- this is standard traffic. Allow it through immediately.
              if sni == authority_no_port then
                return
              end

              -- STEP 2: FETCH CERTIFICATE SANS
              -- SNI and Authority do not match. We must inspect the local certificate
              -- to see if the requested Authority is legally covered by this connection.
              local ssl_info = streamInfo:downstreamSslConnection()
              if ssl_info == nil then return end

              local sans = ssl_info:dnsSansLocalCertificate()
              if sans == nil then return end

              local is_authority_covered = false

              -- STEP 3: SAN COVERAGE CHECK
              -- Iterate through all SANs on the certificate.
              for _, san in ipairs(sans) do
                if string.sub(san, 1, 2) == "*." then
                  -- Handle Wildcard SANs (e.g., *.example.com)
                  local base_domain = string.sub(san, 2) -- Extract ".example.com"
                  -- Check if the requested authority ends with the exact base domain
                  if string.sub(authority_no_port, -string.len(base_domain)) == base_domain then
                    is_authority_covered = true
                    break
                  end
                else
                  -- Handle Exact Match SANs
                  if san == authority_no_port then
                    is_authority_covered = true
                    break
                  end
                end
              end

              -- STEP 4: ENFORCEMENT
              -- If the requested authority IS in the cert's SANs, the client is trying to
              -- reuse a TLS connection meant for a different domain. Return 421.
              --
              -- If the requested authority is NOT in the SANs (e.g., 'localhost'), this block
              -- is skipped. The script ends and Envoy allows the request to proceed natively.
              if is_authority_covered then
                request_handle:respond({[":status"] = "421"}, "Misdirected Request")
              end
            end
